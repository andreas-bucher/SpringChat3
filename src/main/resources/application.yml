
server:
  forward-headers-strategy: framework
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8083}
  ssl:
    enabled: ${SSL_ENABLED:true}
    key-store: ${SSL_KEYSTORE_PATH:classpath:tls/keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: springchat3

logging:
  level:
    root: INFO
    ch.arcticsoft.springchat3: DEBUG
    ch.arcticsoft.springchat3.web: DEBUG
    ch.arcticsoft.springchat3.agent: DEBUG
    org.docx4j.XmlUtils: ERROR
    org.docx4j: WARN
    Embabel: WARN

spring:
  application:
    name: springchat3
  security:
    oauth2:
      client:
        registration:
          # "google" matches CommonOAuth2Provider.GOOGLE, so Spring Boot
          # fills in the authorization/token/user-info endpoints and default
          # scope (openid, profile, email) automatically - no provider:
          # block needed alongside this. No defaults on either value below
          # (fails fast if unset), same convention as SSL_KEYSTORE_PASSWORD
          # above - see ch.arcticsoft.springchat3.security.SecurityConfig
          # and springchat3_authentication.md in project memory.
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # Beyond the default openid/profile/email (see this block's own
            # doc comment above) - drive.readonly (2026-08-22, see
            # springchat3_google_drive.md in project memory: switched from
            # the originally-proposed drive.file because it's genuinely
            # unclear from Google's own docs whether drive.file grants
            # access to a folder's *contents* when the folder itself was
            # picked via Picker, and community reports say it doesn't) lets
            # DriveController read the contents of whichever folder the user
            # links via the Google Picker. Setting `scope` at all replaces
            # CommonOAuth2Provider.GOOGLE's default scope list entirely
            # rather than adding to it, so openid/profile/email have to be
            # listed here explicitly too, or sign-in itself would break.
            scope: openid,profile,email,https://www.googleapis.com/auth/drive.readonly
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:granite4.1:3b}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:corvojaeger/jina-embeddings-v5-text-small}
  model:
    embedding: ollama

embabel:
  # Retries around every LLM call (2026-08-28, from a real run). The default
  # is TEN, and with a long per-call timeout that is a disaster rather than
  # resilience: one impossible request ("make each of the stories longer,
  # around 300 words each" against a local 8B) spent ten minutes retrying,
  # kept its Ollama slot busy, and so made the NEXT turn time out as well -
  # the log showed two turns' retries overlapping. Three attempts still
  # covers what this retry is actually for, which is a malformed structured
  # response, not a model that cannot finish in time.
  agent:
    platform:
      llm-operations:
        data-binding:
          max-attempts: ${EMBABEL_LLM_MAX_ATTEMPTS:3}
  models:
    default-llm: ${OLLAMA_MODEL:granite4.1:3b}
    llms:
      document-search-strategy: ${OLLAMA_DOC_STRATEGY_MODEL:granite4.1:3b}
      document-edit: ${OLLAMA_DOC_EDIT_MODEL:magistral:24b-small-2506-q4_K_M}
      generation: ${OLLAMA_GENERATION_MODEL:magistral:24b-small-2506-q4_K_M}

springchat3:
  data-dir: ${SPRINGCHAT3_DATA_DIR:./data}
  # Per-role LLM timeouts (2026-08-28). Embabel's own default is 60s, which
  # is right for a classifier and much too short for a step that has to WRITE
  # several hundred words - see ChatAgent's own constructor doc comment.
  # Generous on purpose: the cost of a timeout that is too long is one slow
  # turn, the cost of one that is too short is a change that never happens
  # and a retry storm behind it.
  llm-timeouts:
    document-edit-seconds: ${SPRINGCHAT3_DOCUMENT_EDIT_TIMEOUT_SECONDS:900}
    generation-seconds: ${SPRINGCHAT3_GENERATION_TIMEOUT_SECONDS:300}
  # BOOTSTRAP SEED ONLY. Since 2026-08-26 the Google roster lives as rows in
  # users.json ("google": true) alongside password accounts - see
  # ch.arcticsoft.springchat3.security.UserStore. This variable is read on one
  # single occasion: a startup that finds NO users.json at all, where it is
  # written out as rows so a fresh deployment has a way in. It is never read
  # against an existing file, however that file looks - otherwise revoking
  # someone in the file would undo itself on the next restart.
  #
  # An address left here but missing from an existing users.json is therefore
  # somebody who cannot sign in. UserStore logs a WARN naming them at boot;
  # add the row, or drop the address from .env once it is gone.
  #
  # The line stays commented because SPRINGCHAT3_ALLOWED_EMAILS binds to this
  # property through Spring Boot's relaxed binding either way - this is
  # documentation, not wiring. The empty default that keeps an unset variable
  # from failing startup is on the @Value in UserStore, not here.
  #allowed-emails: ${SPRINGCHAT3_ALLOWED_EMAILS:}
  # BOOTSTRAP SEED ONLY, exactly like allowed-emails above (2026-08-26). Admin
  # is now `"admin": true` on a users.json row - see
  # ch.arcticsoft.springchat3.security.Admins - so it hot-reloads and can be
  # granted from the Users screen instead of needing a restart. This variable
  # is read on one single occasion: the same startup that finds NO users.json
  # and writes one from allowed-emails, where it marks which of those rows are
  # administrators. It never marks anything in an existing file, or revoking an
  # administrator there would undo itself on the next restart.
  #
  # So on an install that already had a users.json when this changed, the
  # addresses here are NOT administrators - UserStore logs a WARN naming them
  # at boot. Add `"admin": true` to their rows (no restart needed), then drop
  # the variable from .env.
  #
  # Empty still means NOBODY, not everybody: before any of this existed any
  # signed-in user could flip server policy for everyone, so failing open would
  # keep that bug rather than fix it.
  admin-emails: ${SPRINGCHAT3_ADMIN_EMAILS:}
  google:
    # Google Cloud "Picker API key" (a browser/API key restricted by HTTP
    # referrer in the Cloud Console, not GOOGLE_CLIENT_SECRET - safe to send
    # to the browser) the Google Picker widget needs alongside the OAuth
    # access token DriveController.pickerToken hands out - see
    # springchat3_google_drive.md in project memory. No default (fails fast
    # if unset), same convention as the other required secrets above.
    picker-api-key: ${GOOGLE_PICKER_API_KEY}
  libreoffice:
    # Converting Word documents to PDF for the in-app viewer (2026-08-23 -
    # see springchat3_pdf_preview.md in project memory). Empty by default:
    # PdfConverter probes the two locations this app actually runs from (the
    # LibreOffice.app bundle on macOS, /usr/bin/soffice on the Linux server)
    # plus a bare `soffice` on PATH, so neither machine needs this set. Point
    # LIBREOFFICE_PATH at the binary if it lives somewhere else; if nothing
    # is found the app starts normally and previews are simply unavailable.
    path: ${LIBREOFFICE_PATH:}
    # A 38-page, 4.5 MB document with 18 tables converts in well under a
    # second, so this is a runaway-process backstop, not a real budget.
    timeout-seconds: ${LIBREOFFICE_TIMEOUT_SECONDS:120}
    # Bounds how many soffice processes can exist at once. Not a correctness
    # mechanism - each conversion gets its own LibreOffice profile, which is
    # what makes them safe to run in parallel at all (see PdfConverter) -
    # purely a limit on how much memory a burst of them can claim.
    max-concurrent: ${LIBREOFFICE_MAX_CONCURRENT:2}
  firecrawl:
    # Local/self-hosted Firecrawl instance (2026-08-23, "Web Pages" - see
    # springchat3_projects_panel.md in project memory) - WebPageController
    # POSTs {base-url}/v2/scrape to fetch+convert a linked URL to markdown,
    # replacing this app's own earlier direct-fetch-plus-Jsoup approach
    # (no JS rendering, only basic User-Agent-based anti-bot resilience -
    # see WebPageController's own doc comment for the real digitec.ch 403
    # that motivated switching). Same localhost-default-with-env-override
    # convention as OLLAMA_BASE_URL above - the user's own instance runs on
    # port 3002.
    base-url: ${FIRECRAWL_BASE_URL:http://localhost:3002}
    # Empty by default - a self-hosted Firecrawl instance started with
    # USE_DB_AUTHENTICATION=false (a common self-hosted default, and what
    # the user's own instance appears to be running with, since no key was
    # given) needs no API key at all; WebPageController only sends an
    # Authorization header when this is non-blank. Set FIRECRAWL_API_KEY if
    # this instance requires one, or if this ever points at Firecrawl's
    # hosted cloud API instead (which always requires one).
    api-key: ${FIRECRAWL_API_KEY:}

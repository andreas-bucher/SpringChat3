
server:
  forward-headers-strategy: framework
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8083}
  ssl:
    enabled: ${SSL_ENABLED:true}
    key-store: ${SSL_KEYSTORE_PATH:classpath:tls/keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: springchat3


spring:
  application:
    name: springchat3

  # Ollama runs locally (see https://ollama.com). Override via env vars if it
  # lives somewhere else, or if you want a different local model pulled.
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:granite4.1:3b}

# Embabel's own configuration namespace. Property names have moved around a
# bit between 0.x releases and 1.0.0 - if the app fails to start with an
# "unknown property" or placeholder-resolution error, check the exact keys
# for embabel-agent 1.0.0 at https://docs.embabel.com/embabel-agent/guide/
#
# Two model tiers, same split as SpringChat 2 (Granite for tool/function
# calling, Mistral for generation): default-llm backs classifyIntent /
# planTools / summarizeToolResults / web search, while the "generation" role
# backs only draftReply/reviewReply (see ChatAgent.GENERATION_LLM_ROLE) - the
# steps that actually write the reply text the user reads. The Ollama
# autoconfigure module auto-registers every model `ollama list` shows on
# this host by its exact tag (embabel-agent-ollama-autoconfigure's
# OllamaModelsConfig calls GET /api/tags) - no extra config needed beyond
# having pulled the model, e.g. `ollama pull mistral`.
embabel:
  models:
    default-llm: ${OLLAMA_MODEL:granite4.1:3b}
    llms:
      generation: ${OLLAMA_GENERATION_MODEL:magistral:24b-small-2506-q4_K_M}

# Langfuse tracing (see LangfuseTracing.kt, config package) - reports every
# @Action / LLM call / tool call as an OpenTelemetry span over OTLP, so each
# chat turn shows up in Langfuse as one trace. Defaults assume a self-hosted
# Langfuse on localhost:3000 (its default docker-compose port); point
# LANGFUSE_OTLP_ENDPOINT at https://cloud.langfuse.com/api/public/otel/v1/traces
# (or your region's cloud host) instead if you use Langfuse Cloud. Get
# LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY from your Langfuse project's
# Settings -> API Keys page - traces still get sent without them, but
# Langfuse will likely reject them (401) since it expects Basic auth.
# Set LANGFUSE_ENABLED=false to turn this off entirely (e.g. if you're not
# running Langfuse right now and don't want the export-failure log noise).
langfuse:
  enabled: ${LANGFUSE_ENABLED:true}
  otlp-endpoint: ${LANGFUSE_OTLP_ENDPOINT:http://localhost:3000/api/public/otel/v1/traces}
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  # All-or-nothing: when true, every input/output attribute this listener
  # sets (trace, generation, tool span) is replaced with a fixed placeholder
  # instead of the real content. Off by default - this app's own data
  # (weather/location/transport queries) isn't sensitive - see the SENSITIVE
  # DATA note in LangfuseTracing.kt before pointing this at anything that is.
  mask-content: ${LANGFUSE_MASK_CONTENT:false}

# Default-deny logging: root at WARN so framework/library startup chatter
# and internal traces are silent unless something's actually wrong, then
# explicitly allow-list what's worth seeing. Things worth knowing if you
# tune this further:
#  - "Embabel" (yes, that literal logger name, not a package) is
#    embabel-agent's own step-by-step narration - LoggingAgenticEventListener
#    (embabel-agent-api) logs essentially every agent-process/tool-call/LLM-
#    request/response event at INFO under LoggerFactory.getLogger("Embabel"),
#    which is what actually produces most of this app's log volume per chat
#    turn (~25-30 lines: process creation, plan formulated, one action-start/
#    result and one LLM-request/response pair per @Action, goal achieved,
#    process completion). Set it back to INFO if you want that full
#    narration while developing.
#  - "Embabel.Llm" / "Embabel.Tools" are two MORE GRANULAR loggers this app
#    adds itself (GranularEventLogging.kt, config package) alongside
#    Embabel's default one - a second AgenticEventListener bean that picks
#    out just LLM request/response traffic and just tool calls and logs
#    each on its own logger, independent of the main "Embabel" narration.
#    That's what lets you see prompts/responses and tool calls without
#    turning the whole play-by-play back on. Add more such loggers in that
#    file (with a matching entry here) for other event categories.
#  - org.springframework.ai.retry.RetryUtils logs a WARN (with full stack
#    trace) on every retried LLM call - left alone here on purpose, since
#    root: WARN keeps it visible. That's the one that would have made the
#    read-timeout bug obvious immediately, so don't silence it further.
logging:
  level:
    root: INFO
    ch.arcticsoft.springchat3: INFO
    ch.arcticsoft.springchat3.web: INFO
    ch.arcticsoft.springchat3.agent: DEBUG
    Embabel: WARN
    Embabel.Llm: INFO
    Embabel.Tools: INFO
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpringChat3</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e3e5e9;
    --text: #1c1e21;
    --muted: #6b7280;
    --accent: #2f6fed;
    --accent-text: #ffffff;
    --bubble-assistant: #eef0f3;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .app {
    max-width: 720px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
  }

  header {
    padding: 20px 4px 14px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }

  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 4px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .row {
    display: flex;
  }

  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .row.user .bubble {
    background: var(--accent);
    color: var(--accent-text);
    border-bottom-right-radius: 4px;
  }

  .row.assistant .bubble {
    background: var(--bubble-assistant);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }

  .row.error .bubble {
    background: #fdecea;
    color: #92251c;
    border: 1px solid #f6c6c0;
  }

  .msg-col {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 75%;
  }

  .row.user .msg-col { align-items: flex-end; }
  .row.assistant .msg-col { align-items: flex-start; }

  .msg-col .bubble { max-width: none; }

  .tool-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tool-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.5;
  }

  .tool-chip .tool-chip-name {
    font-weight: 600;
    color: var(--text);
  }

  .tool-chip .tool-chip-time {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .tool-chip.failed .tool-chip-time {
    color: #92251c;
  }

  .tool-chip.failed {
    background: #fdecea;
    border-color: #f6c6c0;
    color: #92251c;
  }

  .tool-chip.failed .tool-chip-name {
    color: #92251c;
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    padding: 4px 2px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  #empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 14px 4px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }

  #input {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14.5px;
    font-family: inherit;
    line-height: 1.4;
    max-height: 140px;
    background: var(--panel);
    color: var(--text);
  }

  #input:focus {
    outline: none;
    border-color: var(--accent);
  }

  #send {
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 12px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }

  #send:disabled {
    background: #b9c6ec;
    cursor: not-allowed;
  }

  #send:not(:disabled):hover {
    filter: brightness(0.95);
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>SpringChat3</h1>
    <p>Local chat agent, served over WebFlux</p>
  </header>

  <div id="messages">
    <div id="empty-state">Say hello to get started.</div>
  </div>

  <form id="composer">
    <textarea id="input" placeholder="Message SpringChat3…" rows="1" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const emptyStateEl = document.getElementById('empty-state');
  const formEl = document.getElementById('composer');
  const inputEl = document.getElementById('input');
  const sendEl = document.getElementById('send');

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // Matches ToolName in ChatAgent.kt - falls back to the raw enum value for
  // anything added there that isn't listed here yet.
  const TOOL_LABELS = {
    WEB_SEARCH: 'Web search',
    LOCATION: 'Location',
    WEATHER: 'Weather',
    WEATHER_FORECAST: 'Weather forecast',
    SWISS_WEATHER: 'MeteoSwiss weather',
    SWISS_WEATHER_FORECAST: 'MeteoSwiss forecast',
    PUBLIC_TRANSPORT: 'Public transport',
  };

  function buildToolChips(toolCalls) {
    const chips = document.createElement('div');
    chips.className = 'tool-chips';
    for (const call of toolCalls) {
      const chip = document.createElement('span');
      chip.className = 'tool-chip' + (call.failed ? ' failed' : '');
      chip.title = call.failed ? 'This tool call did not return a usable result' : '';
      const name = document.createElement('span');
      name.className = 'tool-chip-name';
      name.textContent = TOOL_LABELS[call.tool] ?? call.tool;
      chip.appendChild(name);
      // GeoTool.CURRENT_LOCATION in ChatAgent.kt - the sentinel planTools
      // uses instead of a place name when the user means "here"/"nearby".
      const queryLabel = call.query === 'CURRENT_LOCATION' ? 'current location' : call.query;
      if (queryLabel) {
        chip.appendChild(document.createTextNode(queryLabel));
      }
      if (typeof call.seconds === 'number') {
        const time = document.createElement('span');
        time.className = 'tool-chip-time';
        time.textContent = call.seconds.toFixed(1) + 's';
        chip.appendChild(time);
      }
      chips.appendChild(chip);
    }
    return chips;
  }

  function addRow(role, text, toolCalls) {
    if (emptyStateEl) emptyStateEl.remove();
    const row = document.createElement('div');
    row.className = 'row ' + role;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    if (toolCalls && toolCalls.length) {
      const col = document.createElement('div');
      col.className = 'msg-col';
      col.appendChild(buildToolChips(toolCalls));
      col.appendChild(bubble);
      row.appendChild(col);
    } else {
      row.appendChild(bubble);
    }

    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addTypingRow() {
    if (emptyStateEl) emptyStateEl.remove();
    const row = document.createElement('div');
    row.className = 'row assistant';
    row.innerHTML = '<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  }

  // Ask the browser for its location so the assistant can answer things like
  // "what's the weather here" or "where am I". Resolves to null (rather than
  // rejecting) if geolocation isn't supported, permission is denied, or it
  // just takes too long - the chat still works fine without it.
  function getBrowserLocation() {
    return new Promise((resolve) => {
      if (!('geolocation' in navigator)) {
        resolve(null);
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }),
        () => resolve(null),
        { timeout: 3000, maximumAge: 5 * 60 * 1000 },
      );
    });
  }

  inputEl.addEventListener('input', autoGrow);

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      formEl.requestSubmit();
    }
  });

  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = inputEl.value.trim();
    if (!message) return;

    addRow('user', message);
    inputEl.value = '';
    autoGrow();
    sendEl.disabled = true;

    const typingRow = addTypingRow();

    try {
      const location = await getBrowserLocation();
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, ...(location ?? {}) }),
      });

      if (!res.ok) {
        throw new Error('Server responded with ' + res.status);
      }

      const data = await res.json();
      typingRow.remove();
      addRow('assistant', data.text ?? '(empty response)', data.toolCalls);
    } catch (err) {
      typingRow.remove();
      addRow('error', 'Something went wrong: ' + err.message);
    } finally {
      sendEl.disabled = false;
      inputEl.focus();
    }
  });
</script>
</body>
</html>

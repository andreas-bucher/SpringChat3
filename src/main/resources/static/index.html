<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpringChat3</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e3e5e9;
    --text: #1c1e21;
    --muted: #6b7280;
    --accent: #2f6fed;
    --accent-text: #ffffff;
    --bubble-assistant: #eef0f3;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .app {
    max-width: 720px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
  }

  header {
    padding: 20px 4px 14px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 4px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .row {
    display: flex;
  }

  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .row.user .bubble {
    background: var(--accent);
    color: var(--accent-text);
    border-bottom-right-radius: 4px;
  }

  .row.assistant .bubble {
    background: var(--bubble-assistant);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }

  .row.error .bubble {
    background: #fdecea;
    color: #92251c;
    border: 1px solid #f6c6c0;
  }

  .msg-col {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 75%;
  }

  .row.user .msg-col { align-items: flex-end; }
  .row.assistant .msg-col { align-items: flex-start; }

  .msg-col .bubble { max-width: none; }

  /*
   * Collapsed-by-default disclosure showing the pipeline timeline (see
   * ChatReply.steps in ChatAgent.kt) with each turn's tool calls nested
   * under the "Analyzing message ..." step - a native <details>/<summary>
   * element so expand/collapse is free (keyboard-accessible, no JS state).
   */
  .trace summary {
    list-style: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 0;
    font-size: 12px;
    color: var(--muted);
    user-select: none;
  }

  .trace summary::-webkit-details-marker { display: none; }

  .trace summary::before {
    content: '▸';
    display: inline-block;
    font-size: 9px;
    transition: transform 0.15s ease;
  }

  .trace[open] summary::before {
    transform: rotate(90deg);
  }

  .trace.failed summary {
    color: #92251c;
  }

  .trace-body {
    margin-top: 6px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12.5px;
  }

  .trace-step {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }

  .trace-step-name {
    font-weight: 600;
  }

  .trace-time {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .trace-tools {
    margin: 2px 0 2px 4px;
    padding-left: 8px;
    border-left: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .trace-tool {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    color: var(--muted);
  }

  .trace-tool.failed {
    color: #92251c;
  }

  .trace-tool.failed .trace-time {
    color: #92251c;
  }

  .trace-status {
    display: inline-flex;
    align-items: center;
  }

  .spinner {
    width: 9px;
    height: 9px;
    border: 1.5px solid var(--border);
    border-top-color: var(--muted);
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    padding: 4px 2px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  #empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 14px 4px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }

  #input {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14.5px;
    font-family: inherit;
    line-height: 1.4;
    max-height: 140px;
    background: var(--panel);
    color: var(--text);
  }

  #input:focus {
    outline: none;
    border-color: var(--accent);
  }

  #send {
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 12px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }

  #send:disabled {
    background: #b9c6ec;
    cursor: not-allowed;
  }

  #send:not(:disabled):hover {
    filter: brightness(0.95);
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>SpringChat3</h1>
  </header>

  <div id="messages">
    <div id="empty-state">Say hello to get started.</div>
  </div>

  <form id="composer">
    <textarea id="input" placeholder="Message SpringChat3…" rows="1" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const emptyStateEl = document.getElementById('empty-state');
  const formEl = document.getElementById('composer');
  const inputEl = document.getElementById('input');
  const sendEl = document.getElementById('send');

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // Matches each tool's real Spring AI @Tool(name = ...) in GeoTool.kt/
  // CurrentLocationTool.kt/MeteoSwissWeatherTool.kt now, not a
  // hand-maintained enum - falls back to the raw tool name for anything
  // added there that isn't listed here yet.
  const TOOL_LABELS = {
    lookup_place: 'Lookup place',
    get_user_location: 'Get user location',
    get_meteoswiss_weather: 'MeteoSwiss weather',
  };

  // Step label ChatAgent.gatherInfo (ChatAgent.kt) records - the step whose
  // time the individual tool calls are a breakdown of, so that's where
  // toolCalls get nested inside the trace rather than shown as a separate,
  // unrelated timeline.
  const EXECUTE_STEP_NAME = 'Analyzing message ...';

  // get_user_location takes no arguments, so its tool-input payload is
  // empty/"{}" rather than a place name worth displaying - see
  // ToolCallProgressBridge.kt for where this string comes from.
  function toolInputLabel(input) {
    return input && input !== '{}' && input !== 'null' ? input : '';
  }

  function buildToolRow(call) {
    const row = document.createElement('div');
    row.className = 'trace-tool' + (call.failed ? ' failed' : '');
    row.title = call.failed ? 'This tool call did not return a usable result' : '';
    const label = document.createElement('span');
    const inputLabel = toolInputLabel(call.input);
    label.textContent = (TOOL_LABELS[call.tool] ?? call.tool) + (inputLabel ? ': ' + inputLabel : '');
    row.appendChild(label);
    if (typeof call.seconds === 'number') {
      const time = document.createElement('span');
      time.className = 'trace-time';
      time.textContent = call.seconds.toFixed(1) + 's';
      row.appendChild(time);
    }
    return row;
  }

  function buildToolsGroup(toolCalls) {
    const group = document.createElement('div');
    group.className = 'trace-tools';
    for (const call of toolCalls) {
      group.appendChild(buildToolRow(call));
    }
    return group;
  }

  // Collapsed-by-default disclosure over ChatReply.steps + toolCalls (see
  // ChatAgent.kt) - a "1.9s · 2 tools" summary that expands into the full
  // per-step timeline, with tool calls nested under whichever step actually
  // ran them, rather than two permanently-visible, visually-flat chip rows.
  // Returns null when there's nothing to show (e.g. "hello", no tools).
  function buildTrace(steps, toolCalls) {
    const hasSteps = steps && steps.length;
    const hasTools = toolCalls && toolCalls.length;
    if (!hasSteps && !hasTools) return null;

    const anyFailed = hasTools && toolCalls.some((call) => call.failed);
    const totalSeconds = (steps || []).reduce((sum, s) => sum + (s.seconds || 0), 0);

    const details = document.createElement('details');
    details.className = 'trace' + (anyFailed ? ' failed' : '');
    // Auto-expand only when something failed, so problems surface by
    // default while the common (all-succeeded) case stays out of the way.
    if (anyFailed) details.open = true;

    const summary = document.createElement('summary');
    const timeLabel = document.createElement('span');
    timeLabel.textContent = totalSeconds > 0 ? totalSeconds.toFixed(1) + 's' : 'Details';
    summary.appendChild(timeLabel);
    if (hasTools) {
      const sep = document.createElement('span');
      sep.textContent = '·';
      summary.appendChild(sep);
      const toolsLabel = document.createElement('span');
      toolsLabel.textContent = toolCalls.length + (toolCalls.length === 1 ? ' tool' : ' tools');
      summary.appendChild(toolsLabel);
    }
    if (anyFailed) {
      const warn = document.createElement('span');
      warn.textContent = '⚠';
      summary.appendChild(warn);
    }
    details.appendChild(summary);

    const body = document.createElement('div');
    body.className = 'trace-body';
    let toolsNested = false;
    for (const step of (steps || [])) {
      const row = document.createElement('div');
      row.className = 'trace-step';
      const name = document.createElement('span');
      name.className = 'trace-step-name';
      name.textContent = step.step;
      const time = document.createElement('span');
      time.className = 'trace-time';
      time.textContent = (step.seconds ?? 0).toFixed(1) + 's';
      row.appendChild(name);
      row.appendChild(time);
      body.appendChild(row);

      if (hasTools && step.step === EXECUTE_STEP_NAME) {
        body.appendChild(buildToolsGroup(toolCalls));
        toolsNested = true;
      }
    }
    // Fallback for a reply with tool calls but no matching "Execute tools"
    // step (e.g. no steps at all) - still show them rather than drop them.
    if (hasTools && !toolsNested) {
      body.appendChild(buildToolsGroup(toolCalls));
    }
    details.appendChild(body);

    return details;
  }

  function addRow(role, text, toolCalls, steps) {
    if (emptyStateEl) emptyStateEl.remove();
    const row = document.createElement('div');
    row.className = 'row ' + role;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    const trace = buildTrace(steps, toolCalls);

    if (trace) {
      const col = document.createElement('div');
      col.className = 'msg-col';
      col.appendChild(trace);
      col.appendChild(bubble);
      row.appendChild(col);
    } else {
      row.appendChild(bubble);
    }

    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function spinnerEl() {
    const span = document.createElement('span');
    span.className = 'spinner';
    return span;
  }

  // Live counterpart to buildTrace() above: instead of one collapsed
  // disclosure built after the fact from a finished ChatReply, this is an
  // always-open panel that starts empty and is filled in step by step as
  // /chat/stream's NDJSON events (see ChatProgress.kt) arrive - each step
  // appears with a spinner, then gets its time once its "*-finished" event
  // shows up, same for tool calls nested under "Execute tools". Replaces
  // the old plain three-dot typing indicator.
  function addLiveProgressRow() {
    if (emptyStateEl) emptyStateEl.remove();
    const row = document.createElement('div');
    row.className = 'row assistant';
    const col = document.createElement('div');
    col.className = 'msg-col';
    const panel = document.createElement('div');
    panel.className = 'trace-body';
    col.appendChild(panel);
    row.appendChild(col);
    messagesEl.appendChild(row);
    scrollToBottom();
    return { row, panel, stepStatusEls: new Map(), toolsGroupEl: null, toolEls: new Map() };
  }

  function addLiveStep(live, stepName) {
    const stepRow = document.createElement('div');
    stepRow.className = 'trace-step';
    const name = document.createElement('span');
    name.className = 'trace-step-name';
    name.textContent = stepName;
    const status = document.createElement('span');
    status.className = 'trace-status';
    status.appendChild(spinnerEl());
    stepRow.appendChild(name);
    stepRow.appendChild(status);
    live.panel.appendChild(stepRow);
    live.stepStatusEls.set(stepName, status);

    // ChatAgent.kt's analyzeMessage is the one step individual tool calls
    // belong under - reserve the nested group here so tool-started events
    // (which can arrive interleaved with this step still "running") have
    // somewhere to attach.
    if (stepName === EXECUTE_STEP_NAME) {
      const group = document.createElement('div');
      group.className = 'trace-tools';
      live.panel.appendChild(group);
      live.toolsGroupEl = group;
    }
    scrollToBottom();
  }

  function finishLiveStatus(statusEl, seconds) {
    if (!statusEl) return;
    statusEl.textContent = '';
    const time = document.createElement('span');
    time.className = 'trace-time';
    time.textContent = seconds.toFixed(1) + 's';
    statusEl.appendChild(time);
  }

  function addLiveTool(live, index, tool, input) {
    if (!live.toolsGroupEl) return; // defensive: "Analyzing message ..." always starts first
    const row = document.createElement('div');
    row.className = 'trace-tool';
    const label = document.createElement('span');
    const inputLabel = toolInputLabel(input);
    label.textContent = (TOOL_LABELS[tool] ?? tool) + (inputLabel ? ': ' + inputLabel : '');
    const status = document.createElement('span');
    status.className = 'trace-status';
    status.appendChild(spinnerEl());
    row.appendChild(label);
    row.appendChild(status);
    live.toolsGroupEl.appendChild(row);
    live.toolEls.set(index, { row, status });
    scrollToBottom();
  }

  function finishLiveTool(live, index, seconds, failed) {
    const entry = live.toolEls.get(index);
    if (!entry) return;
    entry.row.classList.toggle('failed', !!failed);
    finishLiveStatus(entry.status, seconds);
  }

  // Applies one NDJSON event from /chat/stream to the live progress panel.
  // 'done'/'failed' are terminal: they replace the live panel with the same
  // addRow(...) rendering a plain (non-streamed) /chat response gets, so the
  // finished message looks identical either way.
  function applyProgressEvent(live, event) {
    switch (event.type) {
      case 'step-started':
        addLiveStep(live, event.step);
        break;
      case 'step-finished':
        finishLiveStatus(live.stepStatusEls.get(event.step), event.seconds);
        break;
      case 'tool-started':
        addLiveTool(live, event.index, event.tool, event.input);
        break;
      case 'tool-finished':
        finishLiveTool(live, event.index, event.seconds, event.failed);
        break;
      case 'done':
        live.row.remove();
        addRow('assistant', event.reply.text ?? '(empty response)', event.reply.toolCalls, event.reply.steps);
        break;
      case 'failed':
        live.row.remove();
        addRow('error', 'Something went wrong: ' + event.message);
        break;
      default:
        // Forward-compatible: an event type this page doesn't know about
        // yet is ignored rather than breaking the whole stream.
        break;
    }
  }

  // Posts to /chat/stream and feeds each newline-delimited JSON object (see
  // ChatProgress.kt) to applyProgressEvent as it arrives, so the live panel
  // fills in incrementally instead of the browser waiting for one final
  // response. A chunk boundary can land mid-object, hence the line buffer.
  async function streamChat(live, message, location) {
    const res = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, ...(location ?? {}) }),
    });

    if (!res.ok || !res.body) {
      throw new Error('Server responded with ' + res.status);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    const consume = (line) => {
      const trimmed = line.trim();
      if (trimmed) applyProgressEvent(live, JSON.parse(trimmed));
    };

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let newlineIndex;
      while ((newlineIndex = buffer.indexOf('\n')) >= 0) {
        consume(buffer.slice(0, newlineIndex));
        buffer = buffer.slice(newlineIndex + 1);
      }
    }
    consume(buffer);
  }

  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  }

  // Ask the browser for its location so the assistant can answer things like
  // "what's the weather here" or "where am I". Resolves to null (rather than
  // rejecting) if geolocation isn't supported, permission is denied, or it
  // just takes too long - the chat still works fine without it.
  //
  // enableHighAccuracy asks the browser to use GPS/Wi-Fi positioning rather
  // than settling for the fastest answer it has, which is often coarse,
  // IP-address-based geolocation - accurate only to "somewhere in the same
  // country" and prone to landing on whatever a geolocation database
  // defaults ambiguous IPs to (a well-known artifact: several such
  // databases default unresolvable US addresses to the Kansas City area,
  // since it's near the geographic center of the continental US and hosts
  // major peering points). The longer timeout (was 3s) gives a real
  // GPS/Wi-Fi fix time to arrive instead of timing out into that same
  // coarse fallback.
  function getBrowserLocation() {
    return new Promise((resolve) => {
      if (!('geolocation' in navigator)) {
        resolve(null);
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }),
        () => resolve(null),
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 5 * 60 * 1000 },
      );
    });
  }

  inputEl.addEventListener('input', autoGrow);

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      formEl.requestSubmit();
    }
  });

  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = inputEl.value.trim();
    if (!message) return;

    addRow('user', message);
    inputEl.value = '';
    autoGrow();
    sendEl.disabled = true;

    const live = addLiveProgressRow();

    try {
      const location = await getBrowserLocation();
      await streamChat(live, message, location);
    } catch (err) {
      // live.row may already be gone if a 'failed' event handled this first
      // (see applyProgressEvent) - removing an already-detached node is a
      // harmless no-op, so no need to guard against that here.
      live.row.remove();
      addRow('error', 'Something went wrong: ' + err.message);
    } finally {
      sendEl.disabled = false;
      inputEl.focus();
    }
  });
</script>
</body>
</html>

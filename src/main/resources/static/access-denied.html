<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not authorized - SpringChat3</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e3e5e9;
    --text: #1c1e21;
    --muted: #6b7280;
    --accent: #2f6fed;
    --accent-text: #ffffff;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 26px;
    text-align: center;
  }

  h1 {
    margin: 0 0 10px;
    font-size: 17px;
    font-weight: 600;
  }

  p {
    margin: 0 0 20px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--muted);
  }

  a.retry {
    display: inline-block;
    padding: 9px 18px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="card">
  <h1>This Google account isn't authorized</h1>
  <p>SpringChat3 is limited to a specific list of Google accounts. If you believe this is a mistake, ask whoever administers this app to add your email to the allow-list.</p>
  <a class="retry" href="/oauth2/authorization/google">Try a different account</a>
</div>
</body>
</html>
